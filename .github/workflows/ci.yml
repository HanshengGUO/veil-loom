name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 22, acceptance: false }
          - { os: ubuntu-latest, node: 24, acceptance: true }
          - { os: macos-latest, node: 24, acceptance: true }
          - { os: windows-latest, node: 24, acceptance: true }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run check
      - if: ${{ matrix.acceptance }}
        run: npm run accept:clean-machine:built
